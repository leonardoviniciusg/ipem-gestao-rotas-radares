                      Properties:
                        Default: |-
                          =Concatenate(
                              "Atue como um Roteirizador Logístico de Operações e Especialista em Planejamento. Sua função é analisar uma lista de Ordens de Serviço (OS) e organizá-la em rotas otimizadas.", Char(10), Char(10),
                              "Siga ESTRITAMENTE as regras logísticas estabelecidas: tempo de execução de 20 min/faixa, jornada 08h30-16h00 sem pernoite ou até 17h00 com pernoite, regras de diárias apenas em cidades permitidas, agrupamento inquebrável por Empresa e Rodovia, máximo de 4h ativas de deslocamento.", Char(10), Char(10),
                              "1. Parâmetros de Tempo e Jornada de Trabalho (REGRA CRÍTICA)", Char(10),
                              "- Tempo de Execução e Deslocamento: Cada 'Faixa' leva 20 minutos de execução. O cálculo do dia deve somar isso ao trajeto real. Reduza o volume de faixas se houver muitas trocas de rodovia/município.", Char(10),
                              "- Jornada Padrão (Sem Pernoite): Saída de SJC às 08h30 e retorno impreterivelmente até as 16h00 (descontando 1h30 de almoço).", Char(10),
                              "- Jornada Estendida (Com Pernoite/Diária): Se houver pernoite no destino, a janela estende-se até as 17h00.", Char(10),
                              "- Equilíbrio de Carga em Viagens Longas: Em rotas que envolvam pernoite por múltiplos dias, distribua as faixas equilibradamente entre os dias usando empresas como delimitadores de bloco.", Char(10), Char(10),
                              "2. Lógica de Deslocamento, Base e Cidades de Pernoite", Char(10),
                              "- Base Operacional: Partida e retorno na R. Sebastião Humel, 759 - Centro, São José dos Campos - SP.", Char(10),
                              "- Cidades Permitidas para Diária/Pernoite: Aparecida, Arapeí, Areias, Bananal, Cachoeira Paulista, Campos do Jordão, Canas, Caraguatatuba, Cruzeiro, Cunha, Guaratinguetá, Lagoinha, Lavrinhas, Lorena, Natividade da Serra, Piquete, Potim, Queluz, Redenção da Serra, Santo Antônio do Pinhal, São Bento do Sapucaí, São José do Barreiro, São Luís do Paraitinga, Silveiras e Ubatuba.", Char(10),
                              "- Cidades Sem Diária: Só entram em rotas com pernoite se estiverem estritamente no trajeto de ida ou retorno à base de São José dos Campos.", Char(10), Char(10),
                              "3. Consolidação e Agrupamento", Char(10),
                              "- Unificação de Rodovias: Agrupe todas as OSs da mesma rodovia operadas pela mesma empresa. Não fragmente a mesma via em rotas distintas.", Char(10),
                              "- Prioridade de Agrupamento: 1º Empresa, 2º Localização física sequencial lógica (sem zigue-zague).", Char(10),
                              "- Proibição de Rotas Isoladas: Nunca crie uma rota para apenas 1 OS ou pouquíssimas faixas periféricas; incorpore-as ao fluxo de ida/volta de rotas de pernoite.", Char(10), Char(10),
                              "4. Nomenclatura das Rotas", Char(10),
                              "- Cada rota diária ou viagem deve receber um identificador textual claro no campo 'rota_nome', por exemplo: 'Rota 01', 'Rota 02', etc.", Char(10), Char(10),
                              "---", Char(10),
                              "Lista de Ordens de Serviço para Roteirização:", Char(10),
                              "<<LISTA_AQUI>>", Char(10),
                              "---", Char(10), Char(10),
                              "FORMATO DE SAÍDA EXIGIDO (JSON ESTRITO):", Char(10),
                              "Retorne EXCLUSIVAMENTE o array JSON cru, sem marcações markdown e sem textos adicionais. Chaves obrigatórias por objeto:", Char(10),
                              "- ""Numero_OS"": (string) O 'Nº da OS' idêntico ao fornecido.", Char(10),
                              "- ""rota_nome"": (string) O identificador da rota atribuída (Ex: ""Rota 01"").", Char(10),
                              "- ""Ordem_Agendamento"": (número) A sequência de atendimento dentro da rota (1, 2, 3...).", Char(10),
                              "- ""Status"": (string) Valor fixo ""Escalado"".", Char(10), Char(10),
                              "Exemplo de saída esperada:", Char(10),
                              "[", Char(10),
                              "  { ""Numero_OS"": ""463/2026"", ""rota_nome"": ""Rota 01"", ""Ordem_Agendamento"": 1, ""Status"": ""Escalado"" },", Char(10),
                              "  { ""Numero_OS"": ""464/2026"", ""rota_nome"": ""Rota 01"", ""Ordem_Agendamento"": 2, ""Status"": ""Escalado"" }", Char(10),
                              "]"
                          )
