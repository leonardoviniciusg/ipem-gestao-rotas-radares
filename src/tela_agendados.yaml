                                                                      <!-- Linha Inferior: Detalhamento de Empresas e Municípios -->
                                                                      <div style='
                                                                          width: 100%;
                                                                          display: flex;
                                                                          flex-direction: column;
                                                                          gap: 3px;
                                                                          overflow: hidden;
                                                                      '>
                                                                          <!-- Linha Empresas -->
                                                                          <div style='display: flex; align-items: center; font-size: 10px; white-space: nowrap; overflow: hidden;'>
                                                                              <span style='font-weight: 700; color: #0F548C; font-size: 9px; margin-right: 4px; min-width: 60px;'>EMPRESAS:</span>
                                                                              <span style='overflow: hidden; text-overflow: ellipsis;'>" &
                                                                                  Concat(
                                                                                      AddColumns(
                                                                                          Distinct(ordensRota, empresa),
                                                                                          subOS, CountRows(Filter(ordensRota, empresa = Value)),
                                                                                          subFaixas, Sum(Filter(ordensRota, empresa = Value), Value(faixas))
                                                                                      ),
                                                                                      "<span style='background: #E3EAF3; border: 1px solid #B0C4DE; padding: 1px 4px; border-radius: 3px; margin-right: 3px;'><b>" & Value & "</b> (" & subOS & " OS · " & subFaixas & " fx)</span>",
                                                                                      ""
                                                                                  ) &
                                                                              "</span>
                                                                          </div>

                                                                          <!-- Linha Municípios -->
                                                                          <div style='display: flex; align-items: center; font-size: 10px; white-space: nowrap; overflow: hidden;'>
                                                                              <span style='font-weight: 700; color: #0F548C; font-size: 9px; margin-right: 4px; min-width: 60px;'>MUNICÍPIOS:</span>
                                                                              <span style='overflow: hidden; text-overflow: ellipsis;'>" &
                                                                                  Concat(
                                                                                      AddColumns(
                                                                                          Distinct(ordensRota, municipio),
                                                                                          subOS, CountRows(Filter(ordensRota, municipio = Value)),
                                                                                          subFaixas, Sum(Filter(ordensRota, municipio = Value), Value(faixas))
                                                                                      ),
                                                                                      "<span style='background: #E3EAF3; border: 1px solid #B0C4DE; padding: 1px 4px; border-radius: 3px; margin-right: 3px;'><b>" & Value & "</b> (" & subOS & " OS · " & subFaixas & " fx)</span>",
                                                                                      ""
                                                                                  ) &
                                                                              "</span>
                                                                          </div>
                                                                      </div>
                                                                  </div>"
                                                              )
                                                          )
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Width: =360
                                                Y: =32
