      - btn_FinalizarAgendamentoGeral:
          Control: ModernIcon@1.1.1
          Properties:
            DisplayMode: |-
              =If(
                  prg_ProgressoAgendamento.Value = 100,
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Height: =65
            Icon: ="ArrowCircleRight"
            IconColor: |-
              =If(
                  prg_ProgressoAgendamento.Value = 100,
                  App.Theme.Colors.Darker10,
                  Color.Gray
              )
            OnSelect: |-
              =ForAll(
                  Filter(colOrdens, status.Value = "Agendado" && !IsBlank(rota_nome)),
                  Patch(
                      lt_op_radar_pendentes,
                      { ID: ThisRecord.ID },
                      {
                          status: { Value: "Agendado" },
                          rota_nome: ThisRecord.rota_nome,
                          equipe: ThisRecord.equipe,
                          dia_ref: ThisRecord.dia_ref,
                          hora_agend: ThisRecord.hora_agend,
                          ordem_agendamento: ThisRecord.ordem_agendamento,
                          data_agend: Switch(
                              ThisRecord.dia_ref,
                              1, dtp_Dia_01.SelectedDate,
                              2, dtp_Dia_02.SelectedDate,
                              3, dtp_Dia_03.SelectedDate,
                              4, dtp_Dia_04.SelectedDate,
                              5, dtp_Dia_05.SelectedDate,
                              6, dtp_Dia_06.SelectedDate,
                              7, dtp_Dia_07.SelectedDate,
                              8, dtp_Dia_08.SelectedDate,
                              9, dtp_Dia_09.SelectedDate,
                              10, dtp_Dia_10.SelectedDate,
                              Blank()
                          )
                      }
                  )
              );
              Notify("Todas as rotas e agendamentos foram salvos com sucesso!", NotificationType.Success, 3000)
            RadiusBottomLeft: =255
            RadiusBottomRight: =255
            RadiusTopLeft: =255
            RadiusTopRight: =255
            Width: =65
            X: =1820
            Y: =485
