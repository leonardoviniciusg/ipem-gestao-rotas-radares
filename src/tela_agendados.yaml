Screens:
  tela_agendados:
    Children:
      - btn_TopBar_Titulo_Agendados:
          Control: ModernButton@1.0.0
          Group: barra_contexto_agendados
          Properties:
            FontWeight: =FontWeight.Lighter
            Height: =55
            Icon: ="CalendarAdd"
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =22
            Text: ="AGENDAMENTO DE RADARES"
            Width: =1920
      - con_TopBar_Nav_Agendados:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Group: barra_contexto_agendados
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Height: =80
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =1920
            Y: =55
          Children:
            - ava_TopBar_Usuario_Agendados:
                Control: ModernAvatar@1.1.0
                Properties:
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =15
                  PaddingLeft: =15
                  PaddingRight: =15
                  PaddingTop: =15
            - lbl_TopBar_Usuario_Agendados:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(8, 52, 100, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =80
                  PaddingLeft: =15
                  Text: =User().FullName
                  Width: =700
                  X: =40
                  Y: =40
            - tab_TopBar_Nav_Agendados:
                Control: ModernTabList@1.0.2
                Properties:
                  Default: |-
                    =Switch(App.ActiveScreen, tela_pendentes, {Value: "Pendentes"}, tela_escalados, {Value: "Escalados"}, tela_agendados, {Value: "Agendados"})
                  Items: |-
                    =Table({Value: "Pendentes"}, {Value: "Escalados"}, {Value: "Agendados"})
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Switch(Self.Selected.Value, "Pendentes", Navigate(tela_pendentes, ScreenTransition.Fade), "Escalados", Navigate(tela_escalados, ScreenTransition.Fade), "Agendados", Navigate(tela_agendados, ScreenTransition.Fade))
                  Size: =22
                  Width: =500
            - rec_TopBar_Espacador_Agendados:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =Color.White
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =100
            - con_TopBar_ProgressoGeral:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height * 0.8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                Children:
                  - prg_ProgressoAgendamento:
                      Control: ModernProgressBar@1.0.0
                      Properties:
                        Height: =Parent.Height * 0.8
                        Value: |-
                          =With(
                              {
                                  /* Condição da Bolinha 1: Sem rotas pendentes na galeria da esquerda */
                                  etapa1Concluida: CountRows(
                                      Filter(
                                          colRotas,
                                          status_rota = "Agendado" &&
                                          CountRows(
                                              Filter(
                                                  colOrdens,
                                                  rota_nome = Value &&
                                                  status.Value = "Agendado" &&
                                                  (IsBlank(equipe.Value) || IsBlank(equipe)) &&
                                                  IsBlank(dia_ref)
                                              )
                                          ) > 0
                                      )
                                  ) = 0,

                                  /* Condição da Bolinha 2: Datas preenchidas até o dia máximo */
                                  maxDiaUtilizado: Max(Filter(colOrdens, status.Value = "Agendado" && !IsBlank(rota_nome)), dia_ref)
                              },
                              With(
                                  {
                                      etapa2Concluida: maxDiaUtilizado > 0 && IsBlank(
                                          First(
                                              Filter(
                                                  AddColumns(
                                                      Sequence(maxDiaUtilizado),
                                                      DataPickerValue,
                                                      Switch(
                                                          Value,
                                                          1, dtp_Dia_01.SelectedDate,
                                                          2, dtp_Dia_02.SelectedDate,
                                                          3, dtp_Dia_03.SelectedDate,
                                                          4, dtp_Dia_04.SelectedDate,
                                                          5, dtp_Dia_05.SelectedDate,
                                                          6, dtp_Dia_06.SelectedDate,
                                                          7, dtp_Dia_07.SelectedDate,
                                                          8, dtp_Dia_08.SelectedDate,
                                                          9, dtp_Dia_09.SelectedDate,
                                                          10, dtp_Dia_10.SelectedDate,
                                                          Blank()
                                                      )
                                                  ),
                                                  IsBlank(DataPickerValue)
                                              )
                                          )
                                      )
                                  },
                                  If(
                                      etapa1Concluida && etapa2Concluida, 100,
                                      etapa1Concluida, 50,
                                      0
                                  )
                              )
                          )
                        Width: =Parent.Width
                        X: '=0   '
                        Y: =6
                  - ico_TopBar_Step1_Concluido:
                      Control: ModernIcon@1.1.1
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =50
                        Icon: |-
                          =If(
                              CountRows(
                                  Filter(
                                      colRotas,
                                      status_rota = "Agendado" &&
                                      CountRows(
                                          Filter(
                                              colOrdens,
                                              rota_nome = Value &&
                                              status.Value = "Agendado" &&
                                              (IsBlank(equipe.Value) || IsBlank(equipe)) &&
                                              IsBlank(dia_ref)
                                          )
                                      ) > 0
                                  )
                              ) = 0,
                              "CheckmarkCircle",
                              "Circle"
                          )
                        IconStyle: |-
                          =If(
                              CountRows(
                                  Filter(
                                      colRotas,
                                      status_rota = "Agendado" &&
                                      CountRows(
                                          Filter(
                                              colOrdens,
                                              rota_nome = Value &&
                                              status.Value = "Agendado" &&
                                              (IsBlank(equipe.Value) || IsBlank(equipe)) &&
                                              IsBlank(dia_ref)
                                          )
                                      ) > 0
                                  )
                              ) = 0,
                              IconStyle.Filled,
                              IconStyle.Outline
                          )
                        Width: =50
                        Y: =7
                  - ico_TopBar_Step2_Concluido:
                      Control: ModernIcon@1.1.1
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =50
                        Icon: |-
                          =With(
                              {
                                  maxDiaUtilizado: Max(Filter(colOrdens, status.Value = "Agendado" && !IsBlank(rota_nome)), dia_ref)
                              },
                              If(
                                  maxDiaUtilizado > 0 && 
                                  IsBlank(
                                      First(
                                          Filter(
                                              AddColumns(
                                                  Sequence(maxDiaUtilizado),
                                                  DataPickerValue,
                                                  Switch(
                                                      Value,
                                                      1, dtp_Dia_01.SelectedDate,
                                                      2, dtp_Dia_02.SelectedDate,
                                                      3, dtp_Dia_03.SelectedDate,
                                                      4, dtp_Dia_04.SelectedDate,
                                                      5, dtp_Dia_05.SelectedDate,
                                                      6, dtp_Dia_06.SelectedDate,
                                                      7, dtp_Dia_07.SelectedDate,
                                                      8, dtp_Dia_08.SelectedDate,
                                                      9, dtp_Dia_09.SelectedDate,
                                                      10, dtp_Dia_10.SelectedDate,
                                                      Blank()
                                                  )
                                              ),
                                              IsBlank(DataPickerValue)
                                          )
                                      )
                                  ),
                                  "CheckmarkCircle",
                                  "Circle"
                              )
                          )
                        IconStyle: |-
                          =With(
                              {
                                  maxDiaUtilizado: Max(Filter(colOrdens, status.Value = "Agendado" && !IsBlank(rota_nome)), dia_ref)
                              },
                              If(
                                  maxDiaUtilizado > 0 && 
                                  IsBlank(
                                      First(
                                          Filter(
                                              AddColumns(
                                                  Sequence(maxDiaUtilizado),
                                                  DataPickerValue,
                                                  Switch(
                                                      Value,
                                                      1, dtp_Dia_01.SelectedDate,
                                                      2, dtp_Dia_02.SelectedDate,
                                                      3, dtp_Dia_03.SelectedDate,
                                                      4, dtp_Dia_04.SelectedDate,
                                                      5, dtp_Dia_05.SelectedDate,
                                                      6, dtp_Dia_06.SelectedDate,
                                                      7, dtp_Dia_07.SelectedDate,
                                                      8, dtp_Dia_08.SelectedDate,
                                                      9, dtp_Dia_09.SelectedDate,
                                                      10, dtp_Dia_10.SelectedDate,
                                                      Blank()
                                                  )
                                              ),
                                              IsBlank(DataPickerValue)
                                          )
                                      )
                                  ),
                                  IconStyle.Filled,
                                  IconStyle.Outline
                              )
                          )
                        Width: =50
                        X: =225
                        Y: =7
                  - ico_TopBar_Step3_Concluido:
                      Control: ModernIcon@1.1.1
                      Properties:
                        Fill: =Color.White
                        Height: =50
                        Icon: |-
                          =With(
                              {
                                  maxDiaUtilizado: Max(Filter(colOrdens, status.Value = "Agendado" && !IsBlank(rota_nome)), dia_ref)
                              },
                              If(
                                  maxDiaUtilizado > 0 && IsBlank(
                                      First(
                                          Filter(
                                              AddColumns(
                                                  Sequence(maxDiaUtilizado),
                                                  DataPickerValue,
                                                  Switch(
                                                      Value,
                                                      1, dtp_Dia_01.SelectedDate,
                                                      2, dtp_Dia_02.SelectedDate,
                                                      3, dtp_Dia_03.SelectedDate,
                                                      4, dtp_Dia_04.SelectedDate,
                                                      5, dtp_Dia_05.SelectedDate,
                                                      6, dtp_Dia_06.SelectedDate,
                                                      7, dtp_Dia_07.SelectedDate,
                                                      8, dtp_Dia_08.SelectedDate,
                                                      9, dtp_Dia_09.SelectedDate,
                                                      10, dtp_Dia_10.SelectedDate,
                                                      Blank()
                                                  )
                                              ),
                                              IsBlank(DataPickerValue)
                                          )
                                      )
                                  ),
                                  "CheckmarkCircle",
                                  "Circle"
                              )
                          )
                        IconColor: |-
                          =With(
                              {
                                  maxDiaUtilizado: Max(Filter(colOrdens, status.Value = "Agendado" && !IsBlank(rota_nome)), dia_ref)
                              },
                              If(
                                  maxDiaUtilizado > 0 && IsBlank(
                                      First(
                                          Filter(
                                              AddColumns(
                                                  Sequence(maxDiaUtilizado),
                                                  DataPickerValue,
                                                  Switch(
                                                      Value,
                                                      1, dtp_Dia_01.SelectedDate,
                                                      2, dtp_Dia_02.SelectedDate,
                                                      3, dtp_Dia_03.SelectedDate,
                                                      4, dtp_Dia_04.SelectedDate,
                                                      5, dtp_Dia_05.SelectedDate,
                                                      6, dtp_Dia_06.SelectedDate,
                                                      7, dtp_Dia_07.SelectedDate,
                                                      8, dtp_Dia_08.SelectedDate,
                                                      9, dtp_Dia_09.SelectedDate,
                                                      10, dtp_Dia_10.SelectedDate,
                                                      Blank()
                                                  )
                                              ),
                                              IsBlank(DataPickerValue)
                                          )
                                      )
                                  ),
                                  Color.Green,
                                  App.Theme.Colors.Darker10
                              )
                          )
                        IconStyle: |-
                          =With(
                              {
                                  maxDiaUtilizado: Max(Filter(colOrdens, status.Value = "Agendado" && !IsBlank(rota_nome)), dia_ref)
                              },
                              If(
                                  maxDiaUtilizado > 0 && IsBlank(
                                      First(
                                          Filter(
                                              AddColumns(
                                                  Sequence(maxDiaUtilizado),
                                                  DataPickerValue,
                                                  Switch(
                                                      Value,
                                                      1, dtp_Dia_01.SelectedDate,
                                                      2, dtp_Dia_02.SelectedDate,
                                                      3, dtp_Dia_03.SelectedDate,
                                                      4, dtp_Dia_04.SelectedDate,
                                                      5, dtp_Dia_05.SelectedDate,
                                                      6, dtp_Dia_06.SelectedDate,
                                                      7, dtp_Dia_07.SelectedDate,
                                                      8, dtp_Dia_08.SelectedDate,
                                                      9, dtp_Dia_09.SelectedDate,
                                                      10, dtp_Dia_10.SelectedDate,
                                                      Blank()
                                                  )
                                              ),
                                              IsBlank(DataPickerValue)
                                          )
                                      )
                                  ),
                                  IconStyle.Filled,
                                  IconStyle.Outline
                              )
                          )
                        Width: =50
                        X: =450
                        Y: =7
                  - lbl_TopBar_Step1_Titulo:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Text: ="Atribuição"
                        Width: =175
                        X: =50
                  - lbl_TopBar_Step2_Titulo:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Text: ="Datas"
                        Width: =175
                        X: =275
      - rec_Fundo_Agendados:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(241, 244, 249, 1)
            Height: =765
            Width: =1920
            Y: =135
      - con_Grid_Principal_Agendados:
          Control: GroupContainer@1.5.0
          Variant: GridLayout
          Properties:
            Height: =765
            LayoutGap: =15
            LayoutGridColumns: =48
            LayoutGridRows: =19
            Width: =1920
            Y: =135
          Children:
            - con_Card_Equipe2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGridColumnEnd: =46
                  LayoutGridColumnStart: =30
                  LayoutGridRowEnd: =20
                  LayoutGridRowStart: =1
                  X: =428
                  Y: =16
                Children:
                  - con_Header_Equipe2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: |+
                          =App.Theme.Colors.Darker20
                        FillPortions: =0
                        Height: =65
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - ico_Header_Equipe2:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              DisplayMode: =DisplayMode.View
                              Height: =65
                              Icon: =Icon.People
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =15
                              PaddingLeft: =20
                              PaddingRight: =15
                              PaddingTop: =15
                        - lbl_Header_Equipe2:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =65
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =20
                              Text: ="EQUIPE 2"
                  - con_Body_Equipe2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                      Children:
                        - con_Estatisticas_Equipe2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =ColorFade(App.Theme.Colors.Darker20, 90%)
                              FillPortions: =0
                              Height: =80
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                            Children:
                              - lbl_Equipe2_ResumoGeral:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(12, 59, 94, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =35
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =18
                                    Text: |-
                                      =With(
                                          {
                                              ordensEq2: Filter(colOrdens, status.Value = "Agendado" && equipe.Value = "2" && !IsBlank(rota_nome))
                                          },
                                          CountRows(Distinct(ordensEq2, rota_nome)) & " Rotas | " &
                                          CountRows(ordensEq2) & " OS | " &
                                          Coalesce(Sum(ordensEq2, Value(faixas)), 0) & " Faixas"
                                      )
                                    Width: =Parent.Width
                              - con_MetricaFaixas_Equipe2:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =20
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                  Children:
                                    - lbl_TituloCarga_Equipe2:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(12, 59, 94, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Bold
                                          Height: =20
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingLeft: =20
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
                                          Text: ="CARGA DE FAIXAS"
                                          Wrap: =false
                                    - lbl_ValorPercentual_Equipe2:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(12, 59, 94, 1)
                                          FontWeight: =FontWeight.Bold
                                          Height: =20
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: |-
                                            =With(
                                                {
                                                    totFaixasGeral: Coalesce(Sum(Filter(colOrdens, status.Value = "Agendado" && !IsBlank(rota_nome)), Value(faixas)), 0),
                                                    totFaixasEq2: Coalesce(Sum(Filter(colOrdens, status.Value = "Agendado" && equipe.Value = "2" && !IsBlank(rota_nome)), Value(faixas)), 0)
                                                },
                                                Text(
                                                    If(totFaixasGeral > 0, (totFaixasEq2 / totFaixasGeral) * 100, 0),
                                                    "#,##0.0"
                                                ) & "%"
                                            )
                                          Width: =50
                                    - lbl_SubtituloCarga_Equipe2:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(12, 59, 94, 1)
                                          FontWeight: =FontWeight.Lighter
                                          Height: =20
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="das faixas totais"
                                          Width: =95
                              - prg_Equipe2_CargaFaixas:
                                  Control: ModernProgressBar@1.0.0
                                  Properties:
                                    Height: =20
                                    Max: =Coalesce(Sum(Filter(colOrdens, status.Value = "Agendado" && !IsBlank(rota_nome)), Value(faixas)), 1)
                                    Thickness: =ProgressThickness.Large
                                    Value: =Coalesce(Sum(Filter(colOrdens, status.Value = "Agendado" && equipe.Value = "2" && !IsBlank(rota_nome)), Value(faixas)), 0)
                                    Width: =Parent.Width - 30
                                    X: =752
                                    Y: =486
                        - rec_Space_Equipe2:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DisplayMode: =DisplayMode.View
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =15
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =Parent.Width
                        - gal_Equipe2_RotasAtribuidas:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Items: |-
                                =Sort(
                                    Distinct(
                                        Filter(colOrdens, status.Value = "Agendado" && !IsBlank(rota_nome) && equipe.Value = "2"),
                                        rota_nome
                                    ),
                                    Coalesce(
                                        LookUp(colOrdens, rota_nome = Value && status.Value = "Agendado", dia_ref),
                                        999
                                    ),
                                    SortOrder.Ascending
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              TemplateSize: =180
                              Transition: =Transition.Pop
                              Width: =Parent.Width
                            Children:
                              - con_CardItem_FundoAzul_Eq2:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.Semilight
                                    Fill: =App.Theme.Colors.Darker20
                                    Height: =150
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =581
                                    X: =22
                                    Y: =13
                              - con_CardItem_CorpoBranco_Eq2:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =150
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =576
                                    X: =22
                                    Y: =13
                                  Children:
                                    - lbl_Equipe2_ItemRota_Nome:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(12, 59, 94, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =31
                                          Text: =Upper(ThisItem.Value)
                                          VerticalAlign: =VerticalAlign.Bottom
                                          Width: =535
                                          X: =40
                                          Y: =5
                                    - btn_Equipe2_MoverParaEq1:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Height: =150
                                          Icon: ="ArrowLeft"
                                          Layout: =ButtonLayout.IconOnly
                                          OnSelect: |-
                                            =With(
                                                {
                                                    rotaAlvo: ThisItem.Value,
                                                    diaOrigem: Coalesce(
                                                        LookUp(colOrdens, rota_nome = ThisItem.Value && status.Value = "Agendado", dia_ref),
                                                        0
                                                    ),
                                                    proximoDiaEq1: Coalesce(
                                                        Max(
                                                            Filter(colOrdens, status.Value = "Agendado" && equipe.Value = "1"),
                                                            dia_ref
                                                        ),
                                                        0
                                                    ) + 1
                                                },
                                                UpdateIf(
                                                    colOrdens,
                                                    rota_nome = rotaAlvo && status.Value = "Agendado",
                                                    {
                                                        equipe: { Value: "1" },
                                                        dia_ref: proximoDiaEq1
                                                    }
                                                );
                                                UpdateIf(
